<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- warm paper background -->
  <rect width="200" height="200" fill="#f6f3ee"/>

  <g fill="none" stroke="#1a1410" stroke-linecap="round" stroke-linejoin="round">

    <!-- body – hand-drawn organic oval -->
    <path stroke-width="6"
      d="M 45 138
         C 45 112 70 100 100 100
         C 130 100 155 112 155 138
         C 155 164 130 176 100 176
         C 70 176 45 164 45 138 Z"/>

    <!-- neck – smooth bridge from head to body -->
    <path stroke-width="5"
      d="M 79 88 C 77 98 85 104 100 104 C 115 104 123 98 121 88"/>

    <!-- head – slightly organic near-circle -->
    <path stroke-width="5.5"
      d="M 100 34
         C 117 34 129 44 129 60
         C 129 76 117 88 100 88
         C 83 88 71 76 71 60
         C 71 44 83 34 100 34 Z"/>

    <!-- left ear -->
    <path stroke-width="4.5" d="M 75 43 C 66 30 76 22 86 33"/>
    <!-- right ear -->
    <path stroke-width="4.5" d="M 125 43 C 134 30 124 22 114 33"/>

    <!-- left paw -->
    <path stroke-width="6.5" d="M 48 116 C 35 111 29 124 38 134"/>
    <!-- right paw -->
    <path stroke-width="6.5" d="M 152 116 C 165 111 171 124 162 134"/>

    <!-- whiskers left -->
    <line x1="36" y1="62" x2="67" y2="64" stroke-width="2.5"/>
    <line x1="35" y1="69" x2="66" y2="68" stroke-width="2.5"/>
    <!-- whiskers right -->
    <line x1="133" y1="64" x2="164" y2="62" stroke-width="2.5"/>
    <line x1="134" y1="68" x2="165" y2="69" stroke-width="2.5"/>

    <!-- nose -->
    <path stroke-width="3.5" d="M 92 74 C 100 79 108 74"/>

  </g>

  <!-- eyes -->
  <circle cx="87" cy="58" r="4.5" fill="#1a1410"/>
  <circle cx="113" cy="58" r="4.5" fill="#1a1410"/>
  <!-- eye shine -->
  <circle cx="85" cy="56" r="2" fill="#f6f3ee"/>
  <circle cx="111" cy="56" r="2" fill="#f6f3ee"/>
</svg>
